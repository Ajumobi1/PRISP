databases:
  - name: prisp-db
    plan: free
    databaseName: prisp
    user: prisp

services:
  - type: web
    name: prisp-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.init_db || echo "init_db failed, continuing startup"; uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: prisp-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://prisp-frontend.onrender.com

  - type: web
    name: prisp-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: BACKEND_API_BASE_URL
        value: https://prisp-backend.onrender.com/api/v1
