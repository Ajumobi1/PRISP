databases:
  - name: prisp-db
    databaseName: prisp
    user: prisp
    plan: free

services:
  - type: web
    name: prisp-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m app.init_db
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: prisp-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false

  - type: web
    name: prisp-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
