databases:
  - name: prisp-db
    databaseName: prisp
    user: prisp
    plan: free

services:
  - type: web
    name: prisp
    runtime: docker
    repo: https://github.com/Ajumobi1/PRISP
    branch: main
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/tasks
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: prisp-db
          property: connectionString
      - key: BACKEND_PORT
        value: "8000"
